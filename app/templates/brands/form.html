{% extends "base.html" %}
{% block title %}{% if brand %}Edit Brand{% else %}New Brand{% endif %} — ERP PIM{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{% if brand %}Edit Brand{% else %}New Brand{% endif %}</h4>
  <a href="/brands" class="btn btn-sm btn-outline-secondary">← Back</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card">
  <div class="card-body">
    <form method="post" action="{% if brand %}/brands/{{ brand.id }}/edit{% else %}/brands/new{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ brand.name if brand else '' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Website</label>
          <input type="url" name="website" class="form-control" value="{{ brand.website if brand and brand.website else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3">{{ brand.description if brand and brand.description else '' }}</textarea>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" value="on" {% if (brand and brand.is_active) or not brand %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Active</label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">{% if brand %}Save Changes{% else %}Create Brand{% endif %}</button>
          <a href="/brands" class="btn btn-outline-secondary ms-2">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

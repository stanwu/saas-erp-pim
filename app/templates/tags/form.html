{% extends "base.html" %}
{% block title %}{% if tag %}Edit Tag{% else %}New Tag{% endif %} — Stanis PIM{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{% if tag %}Edit Tag{% else %}New Tag{% endif %}</h4>
  <a href="/tags" class="btn btn-sm btn-outline-secondary">← Back</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card">
  <div class="card-body">
    <form method="post" action="{% if tag %}/tags/{{ tag.id }}/edit{% else %}/tags/new{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ tag.name if tag else '' }}" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">{% if tag %}Save Changes{% else %}Create Tag{% endif %}</button>
          <a href="/tags" class="btn btn-outline-secondary ms-2">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

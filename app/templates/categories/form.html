{% extends "base.html" %}
{% block title %}{% if category %}Edit Category{% else %}New Category{% endif %} — Stanis PIM{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{% if category %}Edit Category{% else %}New Category{% endif %}</h4>
  <a href="/categories" class="btn btn-sm btn-outline-secondary">← Back</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card">
  <div class="card-body">
    <form method="post" action="{% if category %}/categories/{{ category.id }}/edit{% else %}/categories/new{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ category.name if category else '' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Parent</label>
          <select name="parent_id" class="form-select">
            <option value="">— None —</option>
            {% for parent in parents %}
            <option value="{{ parent.id }}" {% if category and category.parent_id == parent.id %}selected{% endif %}>{{ parent.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Sort Order</label>
          <input type="number" name="sort_order" class="form-control" value="{{ category.sort_order if category else 0 }}">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3">{{ category.description if category and category.description else '' }}</textarea>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" value="on" {% if (category and category.is_active) or not category %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Active</label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">{% if category %}Save Changes{% else %}Create Category{% endif %}</button>
          <a href="/categories" class="btn btn-outline-secondary ms-2">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{% if user_obj %}Edit User{% else %}New User{% endif %} — Stanis PIM{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{% if user_obj %}Edit User: {{ user_obj.username }}{% else %}New User{% endif %}</h4>
  <a href="/users" class="btn btn-sm btn-outline-secondary">← Back</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card">
  <div class="card-body">
    <form method="post" action="{% if user_obj %}/users/{{ user_obj.id }}/edit{% else %}/users/new{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Username <span class="text-danger">*</span></label>
          <input type="text" name="username" class="form-control" value="{{ user_obj.username if user_obj else '' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">{% if user_obj %}New Password <span class="text-muted small">(leave blank to keep current)</span>{% else %}Password <span class="text-danger">*</span>{% endif %}</label>
          <input type="password" name="password" class="form-control" {% if not user_obj %}required{% endif %}>
        </div>
        <div class="col-md-4">
          <label class="form-label">Role</label>
          <select name="role" class="form-select">
            {% for role in roles %}
            <option value="{{ role.value }}" {% if user_obj and user_obj.role == role %}selected{% endif %}>{{ role.value }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" value="on" {% if (user_obj and user_obj.is_active) or not user_obj %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Active</label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">{% if user_obj %}Save Changes{% else %}Create User{% endif %}</button>
          <a href="/users" class="btn btn-outline-secondary ms-2">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{% if attribute %}Edit Attribute{% else %}New Attribute{% endif %} — ERP PIM{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{% if attribute %}Edit Attribute{% else %}New Attribute{% endif %}</h4>
  <a href="/attributes" class="btn btn-sm btn-outline-secondary">← Back</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card">
  <div class="card-body">
    <form method="post" action="{% if attribute %}/attributes/{{ attribute.id }}/edit{% else %}/attributes/new{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ attribute.name if attribute else '' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Group Name</label>
          <input type="text" name="group_name" class="form-control" value="{{ attribute.group.name if attribute and attribute.group else '' }}" placeholder="Technical Specs">
        </div>
        <div class="col-md-4">
          <label class="form-label">Type</label>
          <select name="attribute_type" class="form-select">
            {% for item in types %}
            <option value="{{ item.value }}" {% if (attribute and attribute.attribute_type == item) or (not attribute and item.value == 'text') %}selected{% endif %}>{{ item.value }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Unit Label</label>
          <input type="text" name="unit_label" class="form-control" value="{{ attribute.unit_label if attribute and attribute.unit_label else '' }}" placeholder="mm / kg / W">
        </div>
        <div class="col-md-4">
          <div class="form-check mt-4 pt-2">
            <input class="form-check-input" type="checkbox" name="is_required" id="is_required" value="on" {% if attribute and attribute.is_required %}checked{% endif %}>
            <label class="form-check-label" for="is_required">Required</label>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Options</label>
          <input type="text" name="raw_options" class="form-control" value="{{ raw_options }}" placeholder="For select types, use comma-separated values">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">{% if attribute %}Save Changes{% else %}Create Attribute{% endif %}</button>
          <a href="/attributes" class="btn btn-outline-secondary ms-2">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
